<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chords CSV Plotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">
    <img src="chords-logo-192x192.png" alt="Chords logo"/>
    <div class="logo-text"><span class="logo-chords">Chords</span><span class="logo-subtitle"> CSV Plotter</span></div>
  </div>

  <div class="topbar-controls">
    <!-- Sample rate -->
    <div class="tb-sr-group">
      <label class="tb-lbl" for="srInput">Sample Rate</label>
      <input id="srInput" class="tb-input" type="number" min="0" step="any" placeholder="250" aria-label="Sample rate in Hz"/>
    </div>

    <!-- Action buttons -->
    <div class="tb-btn-group">
      <div class="tb-scale-control" role="group" aria-label="Vertical scale">
        <button class="tb-scale-btn" id="scaleMinusBtn" type="button" aria-label="Decrease vertical scale" title="Decrease vertical scale">&minus;</button>
        <div class="tb-scale-readout">
          <span>Scale</span>
          <output id="scaleValue" aria-live="polite">1&times;</output>
        </div>
        <button class="tb-scale-btn" id="scalePlusBtn" type="button" aria-label="Increase vertical scale" title="Increase vertical scale">+</button>
      </div>
      <button class="tb-pill" id="fftBtn">FFT</button>
    </div>

    <button class="upload-btn" id="uploadBtn" type="button" onclick="document.getElementById('csvInput').click()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span class="upload-text" id="uploadText">Upload CSV</span>
    </button>
    <input id="csvInput" type="file" accept=".csv,text/csv" class="sr-only"/>
    <button id="helpBtn" class="help-btn" aria-label="Upload a CSV to view the guide" title="Upload a CSV to view the guide" disabled>?</button>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle theme"></button>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- Toggleable channels sidebar and loaded filename -->
  <aside class="sidebar" id="sidebar">
    <button class="ch-header" id="sidebarToggle" type="button" aria-expanded="false" aria-controls="chList" aria-label="Expand channels" title="Expand channels">
      <svg class="ch-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span class="sb-label">Channels</span>
      <svg class="ch-toggle-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-file-row" id="fileBadgeRow">
      <div class="file-badge" id="fileBadge" style="display:none">
        <span class="file-badge-name" id="fileNameDisplay"></span>
        <button class="file-close-btn" id="fileCloseBtn" title="Close file" aria-label="Close file">&#x2715;</button>
      </div>
    </div>
    <div id="chList" class="ch-list">
    </div>
  </aside>

  <!-- WORKSPACE -->
  <div class="workspace">


    <!-- Main area: plot + FFT -->
    <div class="main-area" id="mainArea">

      <div class="plot-col">
        <!-- Scrollable canvas wrapper -->
        <div class="canvas-wrap" id="canvasWrap">
          <div class="canvas-scroll" id="canvasScroll">
            <canvas id="mainCanvas"></canvas>
          </div>
          <!-- Empty state -->
          <div class="empty-state" id="emptyState">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>
            </svg>
            <h3 id="emptyTitle">No data loaded</h3>
            <p id="emptyMessage">Drop a CSV here or choose a file</p>
            <button class="empty-upload-btn" id="emptyUploadBtn" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>Upload CSV</span>
            </button>
          </div>
        </div>

        <!-- Full-recording minimap: drag the window to pan, drag either edge to zoom -->
        <div class="timeline minimap-wrap disabled" id="minimapWrap" aria-label="Data overview and horizontal navigation">
          <span class="timeline-label minimap-offset-label minimap-offset-label--left" id="tlStart">0</span>
          <span class="timeline-label minimap-offset-label minimap-offset-label--right" id="tlEnd">0</span>
          <div class="minimap-track" id="minimapTrack">
            <canvas id="minimapCanvas" class="minimap-canvas" aria-hidden="true"></canvas>
            <div
              class="minimap-viewport"
              id="minimapViewport"
              role="slider"
              tabindex="0"
              aria-label="Visible data window"
              aria-valuemin="0"
              aria-valuemax="0"
              aria-valuenow="0"
            >
              <span class="minimap-window-visual" id="minimapWindowVisual" aria-hidden="true">
                <span class="minimap-handle minimap-handle--left" id="minimapLeftHandle"></span>
                <span class="minimap-handle minimap-handle--right" id="minimapRightHandle"></span>
              </span>
              <span class="minimap-window-grip" aria-hidden="true"><i></i><i></i><i></i></span>
            </div>
          </div>
        </div>
      </div>

      <!-- FFT resize handle (hidden when closed) -->
      <div class="resize-handle-v" id="fftHandle" style="display:none">
        <div class="drag-pill">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- FFT panel -->
      <div class="fft-col" id="fftCol">
        <div class="fft-header">
          <span class="fft-header-title" id="fftHeader">FFT: visible window</span>
          <button id="fftClose" class="fft-close-btn" aria-label="Close FFT panel" title="Close FFT panel">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <!-- FFT channel selector -->
        <div class="fft-ch-bar" id="fftChBar">
          <span style="font-size:.625rem;color:var(--faint);padding:.1rem 0">Open FFT to select channels</span>
        </div>
        <div class="fft-wrap">
          <canvas id="fftCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SAMPLING RATE MODAL -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div>
      <h2 id="modalTitle">Set Sampling Rate</h2>
      <p>Enter the sampling rate for your CSV to display time on the x-axis. You can skip this and set it later in the sidebar.</p>
    </div>
    <div class="modal-input-row">
      <label for="modalSrInput">Sampling rate (Hz)</label>
      <input id="modalSrInput" class="modal-big-input" type="number" min="0" step="any" placeholder="e.g.  250"/>
    </div>
    <div class="modal-actions">
      <button class="modal-skip" id="modalSkip">Skip</button>
      <button class="modal-select" id="modalSelect">Start Plotting →</button>
    </div>
  </div>
</div>

<!-- TOUR SYSTEM -->
<div class="tour-dim"     id="tourDim"></div>
<div class="tour-highlight" id="tourHL"></div>
<div class="tour-card"    id="tourCard" role="dialog" aria-modal="true" aria-label="Tour tip">
  <div class="tour-top">
    <div class="tour-badge" id="tourBadge">Step 1 of 6</div>
    <div class="tour-step-dots" id="tourDots"></div>
    <button class="tour-close" id="tourClose" aria-label="Close tour">&#x2715;</button>
  </div>
  <div class="tour-title-row">
    <div class="tour-icon" id="tourIcon"></div>
    <div class="tour-title" id="tourTitle"></div>
  </div>
  <div class="tour-body" id="tourBody"></div>
  <div class="tour-actions">
    <button class="tour-btn-skip" id="tourSkip">Skip tour</button>
    <button class="tour-btn-prev" id="tourPrev">&#x2190; Back</button>
    <button class="tour-btn-next" id="tourNext">Next &#x2192;</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
